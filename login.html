<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GEMINILE STUDY HUB | Login</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="login-shell">
      <div class="login-hero">
        <img
          class="brand-mark"
          src="assets/image fd/logo.jpg"
          alt="GEMINILE Study Hub logo"
        />
        <h1>
          GEMINILE<br /><span class="hl">STUDY HUB</span>
        </h1>
        <p>
          Find your focus in a calm study environment built for deep work,
          meaningful learning, and productive daily routines.
        </p>
        <ul class="hero-features">
          <li>Real-time availability tracking</li>
          <li>Seamless GCash reservations</li>
          <li>Iced coffees &amp; chilled café favorites</li>
        </ul>
      </div>

      <div class="login-side">
        <div class="login-card">
          <h2 style="text-align: center; font-size: 24px; letter-spacing: 0.08em; text-transform: uppercase;">
            GEMINILE
          </h2>
          <p class="hint" style="text-align: center; margin-top: -6px">
            Welcome back! Ready to focus?
          </p>

          <div class="mode-switch" aria-label="Account action">
            <button type="button" class="mode-btn active" data-mode="login">
              Login
            </button>
            <button type="button" class="mode-btn" data-mode="register">
              Create account
            </button>
          </div>

          <form id="form-login" class="login-form active">
            <label
              >Email or phone number
              <input type="text" id="login-identifier" required />
            </label>
            <label
              >Password
              <input type="password" id="login-password" required />
            </label>
            <button type="submit" class="primary">Login</button>
          </form>

          <!-- New accounts are assigned the customer account type automatically. -->
          <form id="form-register" class="login-form">
            <div class="form-grid" style="padding: 0; border: none">
              <label
                >First name<input type="text" id="reg-first-name" required
              /></label>
              <label
                >Last name<input type="text" id="reg-last-name" required
              /></label>
              <label
                >Phone number<input type="text" id="reg-phone" required
              /></label>
              <label>Email<input type="email" id="reg-email" required /></label>
              <label
                >Password (min. 6 characters)<input
                  type="password"
                  id="reg-password"
                  required
                  minlength="6"
              /></label>
            </div>
            <button type="submit" class="primary">Create account</button>
            <button type="button" class="small-link" id="go-member-login">
              Already have an account? Sign in
            </button>
          </form>

          <div class="form-msg" id="login-msg"></div>
        </div>
      </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script>
      const msgEl = document.getElementById("login-msg");
      function showMsg(text, ok) {
        msgEl.textContent = text;
        msgEl.className = "form-msg " + (ok ? "ok" : "error");
      }

      function switchMode(mode) {
        document
          .querySelectorAll(".mode-btn")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.mode === mode),
          );
        document
          .querySelectorAll(".login-form")
          .forEach((f) => f.classList.remove("active"));
        document.getElementById("form-" + mode).classList.add("active");
        msgEl.textContent = "";
      }
      document
        .querySelectorAll(".mode-btn")
        .forEach((b) =>
          b.addEventListener("click", () => switchMode(b.dataset.mode)),
        );
      document
        .getElementById("go-member-login")
        .addEventListener("click", () => switchMode("login"));

      // Account type is resolved from the matching username, email, or phone.
      document
        .getElementById("form-login")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const identifier = document.getElementById("login-identifier").value;
          const password = document.getElementById("login-password").value;
          const fd = new FormData();
          fd.append("operation", "login");
          fd.append("identifier", identifier);
          fd.append("password", password);
          const res = await apiClient.post(`${baseApiUrl}/auth.php`, fd);
          if (res.data.success) {
            if (res.data.account_type === "staff") {
              showMsg("Login successful. Redirecting…", true);
              setTimeout(() => (window.location.href = "index.html"), 400);
            } else {
              showMsg("Login successful. Opening your dashboard…", true);
              setTimeout(() => (window.location.href = "customer.html"), 400);
            }
          } else {
            showMsg(res.data.message, false);
          }
        });

      // New accounts are always registered as customers.
      document
        .getElementById("form-register")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const fd = new FormData();
          fd.append("operation", "memberRegister");
          fd.append(
            "first_name",
            document.getElementById("reg-first-name").value,
          );
          fd.append(
            "last_name",
            document.getElementById("reg-last-name").value,
          );
          fd.append("phone_number", document.getElementById("reg-phone").value);
          fd.append("email", document.getElementById("reg-email").value);
          fd.append("password", document.getElementById("reg-password").value);
          const res = await apiClient.post(`${baseApiUrl}/auth.php`, fd);
          if (res.data.success) {
            showMsg(
              "Your account has been created successfully. Please sign in to continue.",
              true,
            );
            e.target.reset();
          } else {
            showMsg(res.data.message, false);
          }
        });
    </script>
  </body>
</html>
